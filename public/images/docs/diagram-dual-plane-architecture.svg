<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520">
  <defs>
    <style>
      .font { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", "Inter", system-ui, -apple-system, sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 12px; fill: #64748B; }
      .zone-title { font-size: 13px; font-weight: 700; }
      .zone-sub { font-size: 11.5px; fill: #64748B; }
      .card-title { font-size: 14px; font-weight: 700; fill: #0F172A; }
      .card-desc { font-size: 11.5px; fill: #475569; }
      .badge { font-size: 11px; font-weight: 600; }
      .proto { font-size: 11.5px; font-weight: 600; fill: #334155; }
    </style>
    <filter id="shadow" x="-5%" y="-8%" width="110%" height="122%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0D9488"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="1060" height="520" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="38" class="font title">Herdr2 双平面解耦架构</text>
  <text x="32" y="57" class="font subtitle">前端视图层可随时关闭、升级或重启；全部终端（t*）与智能体（a*）持久化托管在 h2 后台守护进程中</text>

  <!-- TOP ZONE: Client Layer -->
  <rect x="32" y="76" width="996" height="140" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="50" y="100" class="font zone-title" fill="#1D4ED8">前端视图层</text>
  <text x="132" y="100" class="font zone-sub">可随时关闭、热重载或重启，不中断后台会话</text>

  <!-- Client Card 1: Herdr2 Desktop -->
  <g filter="url(#shadow)">
    <rect x="52" y="114" width="300" height="84" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.3"/>
  </g>
  <rect x="66" y="126" width="56" height="20" rx="6" fill="#DBEAFE"/>
  <text x="94" y="140" text-anchor="middle" class="font badge" fill="#1D4ED8">桌面端</text>
  <text x="130" y="141" class="font card-title">Herdr2 桌面窗口</text>
  <text x="66" y="164" class="font card-desc">GPUI 原生 GPU 渲染 + libghostty-vt 真终端</text>
  <text x="66" y="182" class="font card-desc">工作区 / 分栏 / 文件 / 变更 / 快照 / ACP 对话</text>

  <!-- Client Card 2: h2 CLI -->
  <g filter="url(#shadow)">
    <rect x="380" y="114" width="300" height="84" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.3"/>
  </g>
  <rect x="394" y="126" width="50" height="20" rx="6" fill="#DBEAFE"/>
  <text x="419" y="140" text-anchor="middle" class="font badge" fill="#1D4ED8">CLI</text>
  <text x="452" y="141" class="font card-title">h2 命令行客户端</text>
  <text x="394" y="164" class="font card-desc">脚本自动化 / SSH 远程操控 / 父子代理编排</text>
  <text x="394" y="182" class="font card-desc">h2 run · send · wait · read · approve · handoff</text>

  <!-- Client Card 3: Drove Web -->
  <g filter="url(#shadow)">
    <rect x="708" y="114" width="300" height="84" rx="10" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.3"/>
  </g>
  <rect x="722" y="126" width="50" height="20" rx="6" fill="#CCFBF1"/>
  <text x="747" y="140" text-anchor="middle" class="font badge" fill="#0F766E">Web</text>
  <text x="780" y="141" class="font card-title">Drove Web 面板</text>
  <text x="722" y="164" class="font card-desc">只读实时 DAG 编排画布与任务详情工作台</text>
  <text x="722" y="182" class="font card-desc">默认监听 127.0.0.1:7799（支持 ?mock=1）</text>

  <!-- Protocol arrows between Client and Daemon -->
  <line x1="202" y1="202" x2="202" y2="262" stroke="#3B82F6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <rect x="116" y="220" width="172" height="24" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="202" y="236" text-anchor="middle" class="font proto">Unix Socket JSON-RPC</text>

  <line x1="530" y1="202" x2="530" y2="262" stroke="#3B82F6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <rect x="444" y="220" width="172" height="24" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="530" y="236" text-anchor="middle" class="font proto">Unix Socket JSON-RPC</text>

  <line x1="858" y1="202" x2="858" y2="262" stroke="#0D9488" stroke-width="2" marker-start="url(#arr-teal)" marker-end="url(#arr-teal)"/>
  <rect x="794" y="220" width="128" height="24" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1"/>
  <text x="858" y="236" text-anchor="middle" class="font proto">HTTP + SSE</text>

  <!-- BOTTOM ZONE: Daemon Core Layer -->
  <rect x="32" y="266" width="996" height="226" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="50" y="290" class="font zone-title" fill="#0F172A">后台守护层</text>
  <text x="132" y="290" class="font zone-sub">单进程持久运行（支持本机与 SSH 远端主机），窗口关闭或断网不丢会话</text>

  <!-- Central Daemon Bus Bar -->
  <g filter="url(#shadow)">
    <rect x="52" y="304" width="956" height="44" rx="9" fill="#0F172A"/>
  </g>
  <text x="72" y="331" class="font" font-size="14" font-weight="700" fill="#FFFFFF">h2 server 核心守护进程</text>
  <text x="274" y="331" class="font" font-size="12" fill="#CBD5E1">统一事件总线 · 权限仲裁 · 串行收件箱 · 多主机 SSH 路由 · 80+ OpenRPC 方法</text>

  <!-- Connectors from Daemon Bus to 3 Runtime Planes -->
  <line x1="202" y1="348" x2="202" y2="374" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="530" y1="348" x2="530" y2="374" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <line x1="858" y1="348" x2="858" y2="374" stroke="#64748B" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- Plane 1: Interactive PTY Terminals -->
  <g filter="url(#shadow)">
    <rect x="52" y="378" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  </g>
  <rect x="66" y="390" width="76" height="20" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="104" y="404" text-anchor="middle" class="font badge" fill="#1D4ED8">t1, t2, ...</text>
  <text x="152" y="405" class="font card-title">交互式终端平面</text>
  <text x="66" y="429" class="font card-desc">holder 托管真 PTY 会话，完整支持 Shell、</text>
  <text x="66" y="446" class="font card-desc">Vim、TUI 编程 CLI、TrueColor 与滚动历史</text>
  <text x="66" y="463" class="font card-desc" fill="#2563EB">适合：交互式调试、长驻服务、本地/远端 Shell</text>

  <!-- Plane 2: Headless ACP Agents -->
  <g filter="url(#shadow)">
    <rect x="380" y="378" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.4"/>
  </g>
  <rect x="394" y="390" width="76" height="20" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="432" y="404" text-anchor="middle" class="font badge" fill="#6D28D9">a1, a2, ...</text>
  <text x="480" y="405" class="font card-title">无头智能体平面</text>
  <text x="394" y="429" class="font card-desc">ACP v1 stdio NDJSON（零 PTY / 零 TERM 污染）</text>
  <text x="394" y="446" class="font card-desc">串行 Inbox、--steer 抢占、行内权限审批、h2 mcp</text>
  <text x="394" y="463" class="font card-desc" fill="#7C3AED">适合：后台编码、跨模型接力、父子智能体树</text>

  <!-- Plane 3: Drove + Checkpoints + Core AI -->
  <g filter="url(#shadow)">
    <rect x="708" y="378" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
  </g>
  <rect x="722" y="390" width="84" height="20" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="764" y="404" text-anchor="middle" class="font badge" fill="#047857">编排与治理</text>
  <text x="816" y="405" class="font card-title">Drove / 快照 / AI</text>
  <text x="722" y="429" class="font card-desc">多角色 DAG 调度、Worktree 隔离与异构审查</text>
  <text x="722" y="446" class="font card-desc">隐藏 Git Ref 轮次快照回滚 + 轻量 Core AI</text>
  <text x="722" y="463" class="font card-desc" fill="#059669">适合：复杂需求拆分、防翻车回滚、自动验收</text>
</svg>
