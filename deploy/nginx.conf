# 阿里云 ECS Nginx 纯静态部署参考配置（将 dist/ 同步至 /var/www/herdr2-website）
server {
    listen 80;
    # 替换为你的域名；建议通过阿里云 SSL 证书或 certbot 开启 HTTPS
    server_name herdr2.example.com;

    root /var/www/herdr2-website;
    index index.html;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 静态资源长缓存（Astro 构建的 _astro/ 文件带内容哈希）
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Pagefind 搜索索引文件
    location /pagefind/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 默认路由与 404 页面
    location / {
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;
}
